name: Publicar parceiros na Locaweb
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4
      - name: Verificar credenciais
        id: creds
        env:
          FTP_HOST: ${{ secrets.LOCAWEB_FTP_HOST }}
          FTP_USERNAME: ${{ secrets.LOCAWEB_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.LOCAWEB_FTP_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$FTP_HOST" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Configure LOCAWEB_FTP_HOST, LOCAWEB_FTP_USERNAME e LOCAWEB_FTP_PASSWORD em Settings > Secrets and variables > Actions."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publicar na Locaweb
        if: steps.creds.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.LOCAWEB_FTP_HOST }}
          username: ${{ secrets.LOCAWEB_FTP_USERNAME }}
          password: ${{ secrets.LOCAWEB_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: /public_html/parceiro/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            README.md
            .github/**
      - name: Exigir publicação realizada
        if: steps.creds.outputs.ok != 'true'
        run: |
          echo "::error::A publicação não foi executada porque faltam credenciais FTP."
          exit 1
